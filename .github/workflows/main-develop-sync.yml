# main → develop 反向同步（事件驱动，无轮询）
#
# 语义：main 单独承载的提交（hotfix / 纯文档 / CI 直合 main / tag 版本号 bump 等）需同步进 develop，
# 保证 develop ⊇ main，否则下次 develop→main 里程碑会因两侧同文件各自演进冲突（#293 教训）。
#
# 机制：push main → 比较两分支内容，main 确有领先内容时自动开反向 PR（head=main base=develop）
# 并 enable 原生 auto-merge（squash）→ 分支保护的 CI（build + folia-smoke）绿后 GitHub 自动合并。
# 里程碑（develop→main）合并后两分支内容一致 → diff 为空自动跳过，不产生空 PR 噪音。
#
# 说明：
# - auto-merge 须用个人级 PAT（secrets.BOT_PAT）；Actions 内 GITHUB_TOKEN 无法 enable auto-merge（实测）。
# - 反向同步方向不触发本 workflow（本 workflow 只听 push main），也无发布（publish 只听 main）。
name: main→develop 反向同步

on:
  push:
    branches:
      - main

concurrency:
  group: main-develop-sync
  cancel-in-progress: false   # 连续 main push 不互相取消：PR head=main 始终反映最新 main

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以 diff 两分支

      - name: 若无内容差异则跳过
        run: |
          git fetch origin develop --quiet
          if git diff --quiet origin/main origin/develop; then
            echo "两分支内容一致，无需同步（里程碑合并后即此态）"
            exit 0
          fi
          echo "main 有 develop 缺失内容，继续同步"

      - name: 创建/复用反向同步 PR 并 enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail

          # 内容一致性判定函数（主闸 + 复核共用）：比较 main/develop 两分支最新 commit 的 tree sha——
          # 相等 ⟺ 树逐文件相同（内容一致）。服务器端实时、无本地 refs 竞态。
          # 注：GitHub compare API 仅三点（merge-base 语义，里程碑 squash 后 merge-base 陈旧会误报差异，
          # #344 教训：曾误报 107 文件创建空 PR）；两点形式 404。故用 tree sha 精确判定。
          trees_differ() {
            main_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.tree.sha')"
            dev_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq '.commit.tree.sha')"
            [ -n "$main_tree" ] && [ -n "$dev_tree" ] && [ "$main_tree" != "$dev_tree" ]
          }

          # 创建前判定（空转防御主闸）：tree 相同 = 内容一致（纯历史拓扑）→ 不创建 PR。
          if ! trees_differ; then
            echo "main/develop commit tree 相同：内容一致（里程碑 squash 后常态），不创建同步 PR"
            exit 0
          fi
          # 消除本地 git diff 的 refs 新鲜度竞态）。files = 0 = 纯历史拓扑噪音（内容已一致）→ 不创建。
          changed_files="$(gh api "repos/$GITHUB_REPOSITORY/compare/develop..main" --jq '.files | length')"
          if [ "$changed_files" = "0" ]; then
            echo "compare 文件差异为 0：main/develop 内容一致（里程碑 squash 后常态），不创建同步 PR"
            exit 0
          fi
          echo "main/develop tree 不同（内容有差异），创建/复用同步 PR"

          # 复用已存在且未合并的同步 PR（多次 main push 幂等）
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main \
                 --state open --json number,title -q \
                 '.[] | select(.title | startswith("chore(sync):")) | .number' | head -1)"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
                  --title "chore(sync): main → develop 自动同步" \
                  --body "自动同步 PR：main 有 develop 缺失的提交（hotfix/文档/CI 直合）。CI 绿后经原生 auto-merge 自动合并。若冲突请人工解决后合并。")"
            echo "已创建同步 PR: $pr"
          else
            echo "复用已有同步 PR: $pr"
          fi

          # 创建后复核（二线保险）：复用场景下旧 PR 可能已因内容同步变空，或创建瞬间有并发同步——
          # 此刻文件差异已为 0 则关闭，不 enable auto-merge。
          changed_files="$(gh api "repos/$GITHUB_REPOSITORY/compare/develop..main" --jq '.files | length')"
          if [ "$changed_files" = "0" ]; then
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" \
              --comment "空转同步 PR：head=main 相对 develop 无文件差异（内容已一致，纯历史拓扑）——自动关闭。"
            echo "⚠️ 空转同步 PR #$pr 已自动关闭（复核文件差异为 0）"
            exit 0
          fi
          echo "复核文件差异: $changed_files 个，继续 auto-merge"
          echo "compare 文件差异: $changed_files 个，继续 auto-merge"

          # 内容冲突时不 auto-merge，留人工处理（PR 保持打开并注明）
          state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable,mergeStateStatus \
                   -q '"\(.mergeable):\(.mergeStateStatus)"')"
          case "$state" in
            MERGEABLE:*) gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
                         echo "✅ 已 enable auto-merge（CI 绿后自动合并）" ;;
            *)
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
                --body "⚠️ 同步 PR 当前不可合并（$state）。已跳过 auto-merge，请人工解决冲突/检查后合并。"
              echo "⚠️ PR 不可合并（$state），已跳过 auto-merge" ;;
          esac
