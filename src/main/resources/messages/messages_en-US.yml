  timeline_plain: "Online time: {minutes} min"
  progress_met: "✅ Met (will auto-promote to member on next login)"
  progress_left: "{minutes} min remaining"
  next_auto: "Next: auto-promote to member once the online-time goal is met"
  next_apply: "Next, you can apply for: {types}"
  top_level: "You are at the highest rank ({admin})"
  unknown_group: "Current permission group is unknown. Please contact an admin."
  no_applicable: "None (nothing to apply for right now)"
  type_entry: "{name} (/apply {key})"
  list_sep: "; "
  promote_notify: "Your rank has been promoted: {group}."
  demote_notify: "Your rank has been demoted: {group}."
  group:
