# --- bot.* (group command help/usage/examples; P3a default language R1. {name}/{prompt} injected) ---
bot:
  help_title: "🤖 OrzMC Group Commands Help"
  help_intro: "Send \"{prompt}x ?\" to view the usage of a single command"
  help_admin_section: "👨‍💼 Admin Commands"
  help_general_section: "👨‍💻 General Commands"
  admin_required: "{cmd} requires administrator permissions"
  lbl_usage: "📚 Usage:"
  lbl_example: "🚀 Examples:"
  desc:
    l: "List online players"
    w: "List whitelisted players"
    h: "Show help"
    a: "Add players to the whitelist"
    r: "Remove players from the whitelist"
    b: "Backup the world"
    o: "Optimize world size"
    e: "Run a console command"
    d: "Add/remove/list IP blacklist and player-name rules"
    v: "View/handle review applications"
    p: "Permission management (promote/demote)"
  usage:
    a: "🎯 {name} Add players to the whitelist"
    r: "🎯 {name} Remove players from the whitelist"
    e: "🎯 {name} Run a console command"
    d: "🎯 {name} IP / player-name rule management"
    v: "🎯 {name} Review applications"
    p: "🎯 {name} Permission management"
    l: "🎯 {name} List online players"
    w: "🎯 {name} List whitelisted players"
    h: "🎯 {name} Show help"
    b: "🎯 {name} Back up the world"
    o: "🎯 {name} Optimize world size"
  params:
    a: "{name} <players> <players2> ... (space or comma separated, batch supported)"
    r: "{name} <players> <players2> ... (space or comma separated, batch supported)"
    e: "{name} <console command>"
    l: "{name} (no arguments, run directly)"
    w: "{name} [page] (optional, e.g. {name} 2)"
    h: "{name} (no arguments; shows this help)"
    b: "{name} (no arguments; runs a backup)"
    o: "{name} (no arguments; runs an optimization)"
    v: "{name} l [page]       View pending list\n{name} y <player>       Approve\n{name} n <player>       Reject\n(accepts yes/no; use {name} y <typeId> <player> for multiple pending types)"
    p: "{name} u|up <player>     Promote (default→member→builder→admin)\n{name} d|down <player>   Demote (admin→builder→member→default)"
    d: "{name}                 View blacklist\n{name} [IP]            Add blacklist entry\n{name} -[IP]           Remove blacklist entry\n{name} player <type> <value>    Add player-name rule\n{name} -player <type> <value>   Remove player-name rule\n{name} player list              List player-name rules\nMatch types <type>: exact / prefix / suffix / contains / glob (*?) / regex"
  examples:
    a: "{name} Steve\n{name} Steve Alex Bob\n{name} Steve,Alex,Bob"
    r: "{name} Steve\n{name} Steve Alex Bob\n{name} Steve,Alex,Bob"
    e: "{name} plugins\n{name} say Hello everyone"
    l: "{name}"
    w: "{name}\n{name} 2"
    h: "{name}"
    b: "{name}"
    o: "{name}"
    v: "{name} l\n{name} l 2\n{name} y Steve\n{name} y builder-promotion Steve"
    p: "{name} u Steve\n{name} d Steve"
    d: "{name}\n{name} 1.2.3.4\n{name} -1.2.3.4\n{name} player exact Steve\n{name} player prefix bot_\n{name} player suffix _test\n{name} player contains admin\n{name} player glob bot_*\n{name} player regex ^bot\n{name} -player prefix bot_"
  list:
    online_header: "------ Online ({count}/{max}) ------" 
    whitelist_header: "------ Whitelisted players ({count}) ------" 
    cleanup_title: "------ Whitelist cleanup ------" 
    page_meta: "Page {page}/{total}"

