    "off": "The server is not in maintenance mode."
    reason_backup: "Map backup in progress"
    reason_optimize: "Map optimization in progress"
    reason_manual: "Manual maintenance in progress"

# --- guide/menu.* (starter guide / menu hints; P2h1, follows the player's language) ---
guide:
