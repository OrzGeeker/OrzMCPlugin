# ==================================================
#          OrzMC 多语言包：简体中文（主目录）
# ==================================================
#
# 【本文件是 key 完整性基线】所有用户可见文案以此文件为准：代码迁移时把原文抄入
# messages_zh-CN.yml（中文输出零回归），en-US 及其他语言包只做翻译、不允许自造结构。
#
# 【结构】顶层按功能域分组（common.* / teleport.* / whitelist.* / event.* ...），
# 代码按完整 dot key 读取（如 teleport.bow.name）。
#
# 【占位符】动态部分一律 {var}（与 templates.yml 同语法，支持 \n 转义）；
# 同 key 跨语言占位符集合必须一致（启动健康检查 + I18nCatalogConsistencyTest 强制）。
#
# 【屏蔽/覆盖】本内置文件不允许空值；服主如需屏蔽某条消息，请在数据目录
# messages_custom_zh-CN.yml 中把该 key 覆盖为空串 ""。
#
# 【新增语言】在 resources/messages/ 添加 messages_<code>.yml + I18nLoader.CODES 追加一行。
#
# 各域 key 随迁移 PR 分批补入（见 docs/dev/i18n-plan.md §5），当前为空骨架。
#
# --- common.*（跨渠道通用反馈；P1 随命令拦截器迁入） ---
common:
  cooldown: "命令冷却中，请稍后再试"
  admin_required: "需要管理员权限"
  player_required: "需要玩家执行"
  prison_denied: "你正在坐牢，无法使用该命令"
  unknown_player: "未知玩家"
  copy_coords: "点击复制坐标"

# --- teleport.*（传送弓；P2a 随 teleport 域迁入） ---
teleport:
  bow:
    name: "传送弓"
    tag: "[传送弓]"
    lore: "可以把你传送到箭落地的位置"
    given: "你获得了 {name}"
    disabled: "传送弓已被禁用，请与管理员联系"
    hit_water: "箭射进了水里!"
    hit_lava: "箭射进了岩浆里!"
    cross_world: "无法跨世界传送!"
    bad_height: "目标高度不合法!"
    no_landing: "目标位置不可站立!"
    done: "传送完成!"

# --- whitelist.*（登录踢出提示/群通知；P2b。kick 为登录前无客户端 locale，随默认语言） ---
whitelist:
  kick:
    join_hint_prefix: "不在服务器白名单中，请先加入QQ群:"
    join_hint_suffix: "，联系管理员添加白名单"
    discord_join: "you can also join the discord server: "
  notify:
    blocked: "{player} 尝试加入服务器，被白名单拦截"
    toggle_off: "白名单关闭"

# --- portal.*（/portal 命令玩家反馈；P2c） ---
portal:
  usage: "用法: /portal <host> [port] 或 /portal remove <host> [port]"
  usage_remove: "用法: /portal remove <host> [port]"
  port_required: "端口需为数字"
  not_found: "没有匹配的传送门: {target}"
  removed: "已移除 {count} 个传送门 -> {target}"
  created: "已创建传送门 -> {host}:{port} @ [{world}] {x} {y} {z} 轴向:{axis} 框架:4x5"

  command_desc: "创建或移除传送门"

# --- tnt.*（TNT 防护玩家提示/告警标签；P2c。爆炸/放置告警为服务端广播与群通知，随默认语言） ---
tnt:
  anchor_disabled: "重生锚放置已被管理员禁用"
  place_cooldown: "放置TNT冷却中，请等待 "
  cooldown_seconds: "{secs}秒"
  place_disabled: "TNT放置已被管理员禁用"
  prime_denied: "TNT被点燃（已禁止）"
  prime: "TNT被点燃"
  dispense_forbidden: "发射{item}被禁止"
  explode: "{type}爆炸"
  block_explode: "方块爆炸"
  placement_msg: "放置TNT"
  at: "在"
  placed: "放置了 TNT"
  prefix_tnt: "[TNT警报] "
  prefix_explosion: "[爆炸警报] "

# --- player.notify.*（上下线聚合摘要版块标签；P2d。群消息随默认语言 R1） ---
player:
  notify:
    join_label: "上线"
    quit_label: "下线"
    kick_label: "被踢"
    hidden_more: "等{count}人"

# --- geoip.*（地区白名单玩家提示/管理员告警；P2d。登录前无客户端 locale → 默认语言） ---
geoip:
  kick_region: "{name}({ip})\n{country}\nIP位置不在服务支持区域{allow}"
  kick_unverifiable: "{name}({ip})\n地区解析服务暂时不可用，无法验证你的地区，请稍后重新尝试登录"
  outcome_allowed_failopen: "已放行（fail-open）"
  outcome_denied_failclose: "已拒绝（fail-close）"
  outcome_allowed: "已放行"
  outcome_denied: "已拒绝"
  alert_exception: "IP地址解析服务异常: {detail}"
  alert_lookup_failed: "IP地址解析服务异常，{outcome}: {player}({ip})"
  alert_timeout: "IP地址解析超时({timeout}ms)，{outcome}: {player}({ip})"

# --- login.*（IP 黑名单/玩家名规则登录拦截与通知；P2d2。登录前无客户端 locale → 默认语言） ---
login:
  unknown_player: "未知玩家"
  ip_banned: "你的IP已被禁止访问"
  name_rule_denied: "你的玩家名不符合服务器访问规则"
  alert_ip_block: "⚠ IP 黑名单拦截\n玩家: {player}\nIP: {ip}\n命中规则: {pattern}"
  alert_name_block: "⚠ 玩家名规则拦截\n玩家: {player}\n命中规则: {rule}"

# --- guard.*（危险命令拦截；P2e。安全提示统一默认语言 R1） ---
guard:
  deny_reason: "命令「{cmd}」已被安全拦截（危险命令 deny-list）"
  selector_warn: "命令含未限定范围的 {selector}，可能影响全体实体/玩家，请确认已用 type=.. 或 distance=.. 限定"
  source_player: "玩家"
  source_console: "控制台/RCON"
  alert_blocked: "⚠ 高危命令已被拦截\n命令: {command}\n来源: {source} | 发送者: {sender}\n原因: {reason}"

# --- exploit.*（漏洞利用加固；P2e） ---
exploit:
  notify_pages: "书页超限（{count} 页）"
  notify_attributes: "物品属性修饰符异常（清理 {count} 件）"
  alert_blocked: "⚠ 漏洞利用拦截\n玩家: {player}\n原因: {reason}"

# --- ratelimit.*（登录限流；P2e） ---
ratelimit:
  reason_frequency: "频率超限（{limit} 次/分钟）"
  reason_concurrent: "同 IP 并发超限（{limit} 人）"
  alert_blocked: "⚠ 登录限流\nIP: {ip}\n玩家: {player}\n原因: {reason}"

# --- prison.*（坐牢；P2f1。管理员结果文案随默认语言 R1，当事人私聊随当事人语言） ---
prison:
  lp_unavailable: "LuckPerms 不可用，无法执行坐牢操作"
  lp_unavailable_release: "LuckPerms 不可用，无法执行解除坐牢操作"
  imprison_failed: "坐牢失败（数据写入失败，请重试或联系管理员）"
  release_failed: "解除坐牢失败（数据写入失败，请重试或联系管理员）"
  not_prisoner: "该玩家不在牢房中"
  imprison_player_msg: "你已被关入牢房。"
  release_player_msg: "你已解除坐牢。"
  imprison_ok: "已将 {player} 关入牢房（原组 {group}）"
  release_ok: "已解除 {player} 的坐牢（恢复组 {group}）"
  player_not_found: "找不到玩家: {player}"

# --- gamemode.*（权限组变化自动切生存提示；P2f1） ---
gamemode:
  fix_message: "你的权限组已变化，游戏模式已切换为生存模式。"

# --- review.*（/apply 命令文案；P2f2 按执行玩家语言。类型名 displayName 为配置数据不迁） ---
review:
  list_header: "可申请："
  no_types: "当前没有可申请的审核类型。"
  type_unknown: "未知申请类型: {type}（/apply 查看可申请项）"
  type_unknown_bare: "未知申请类型: {type}"
  my_applications: "你的申请："
  no_applications: "你还没有提交过申请。"
  status_pending: "⏳ 待审核"
  status_approved: "✅ 已通过"
  status_rejected: "❌ 已拒绝"
  status_cancelled: "↩️ 已撤回"
  reviewer_suffix: "（{reviewer}）"
